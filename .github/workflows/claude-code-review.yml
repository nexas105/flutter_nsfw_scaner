name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Docs-only PRs don't need a code review.
    paths-ignore:
      - '**.md'
      - 'doc/**'

# Cancel an in-flight review when a newer commit lands on the same PR.
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip drafts — no point burning a review on WIP.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read # let the review read CI results on the PR
    steps:
      # Skip cleanly (green, not failed) until CLAUDE_CODE_OAUTH_TOKEN is set.
      - name: Gate on token presence
        id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set — skipping Claude review."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Automated PR review
        if: steps.gate.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR: code quality, error handling and edge cases,
            security, performance, and test coverage. Leave inline comments for
            specific issues, a top-level comment for general observations.
          claude_args: |
            --model sonnet
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
